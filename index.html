<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYNCTROL — 网站建设中</title>
  <meta name="description" content="Synctrol 音乐社团官方网站，建设中。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <div class="bg-noise" aria-hidden="true"></div>
  <div class="bg-scanline" aria-hidden="true"></div>
  <div class="bg-shapes" aria-hidden="true">
    <div class="shape shape-a"></div>
    <div class="shape shape-b"></div>
    <div class="shape shape-c"></div>
  </div>

  <header class="bar bar-top">
    <span>SYNCTROL&nbsp;·&nbsp;OFFICIAL WEBSITE</span>
    <nav class="theme-toggle" aria-label="主题切换">
      <button type="button" data-theme-choice="light" class="theme-option theme-light" aria-pressed="false">亮色</button>
      <span class="theme-sep" aria-hidden="true">/</span>
      <button type="button" data-theme-choice="dark" class="theme-option theme-dark" aria-pressed="false">暗色</button>
    </nav>
  </header>

  <main class="grid">
    <section class="cell cell-title">
      <h1 class="logo">SYNCTROL</h1>
      <p class="logo-sub">MUSIC CLUB</p>
    </section>
    <section class="cell cell-deco" aria-hidden="true">
      <div class="deco-symbol"></div>
      <p class="deco-label">BLACK&nbsp;SQUARE</p>
    </section>
    <section class="cell cell-status">
      <h2 class="status-title">网站建设中</h2>
      <p class="status-sub">UNDER&nbsp;CONSTRUCTION</p>
    </section>
  </main>

  <footer class="bar bar-bottom">
    <span>敬请期待 · STAY TUNED</span>
    <a class="github-link" href="https://github.com/synctrol" target="_blank" rel="noopener noreferrer">GITHUB&nbsp;↗</a>
  </footer>
  <script>
    (function () {
      var root = document.documentElement;
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      var lightBtn = document.querySelector('.theme-light');
      var darkBtn = document.querySelector('.theme-dark');

      function highlight(theme) {
        var lightActive = theme === 'light';
        lightBtn.setAttribute('aria-pressed', lightActive);
        darkBtn.setAttribute('aria-pressed', !lightActive);
      }

      function current() {
        return root.getAttribute('data-theme') || (media.matches ? 'dark' : 'light');
      }

      function setTheme(theme) {
        root.setAttribute('data-theme', theme);
        highlight(theme);
      }

      lightBtn.addEventListener('click', function () { setTheme('light'); });
      darkBtn.addEventListener('click', function () { setTheme('dark'); });

      highlight(current());

      function onSystemChange() {
        if (!root.hasAttribute('data-theme')) {
          highlight(media.matches ? 'dark' : 'light');
        }
      }

      if (media.addEventListener) {
        media.addEventListener('change', onSystemChange);
      } else if (media.addListener) {
        media.addListener(onSystemChange);
      }
    })();
  </script>
</body>
</html>
